name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: detect_node
        run: |
          if [ -f package.json ]; then
            echo "node_present=true" >> $GITHUB_OUTPUT
          else
            echo "node_present=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js ${{ matrix.node-version }}
        if: ${{ steps.detect_node.outputs.node_present == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.detect_node.outputs.node_present == 'true' }}
        run: |
          if [ -f package-lock.json ] || [ -f pnpm-lock.yaml ] || [ -f yarn.lock ]; then
            echo "Lockfile found — using npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "package.json found but no lockfile — running npm install"
            npm install
          else
            echo "No JavaScript project detected — skipping install"
          fi

      - name: Run test suite
        if: ${{ steps.detect_node.outputs.node_present == 'true' }}
        run: |
          if [ -f package.json ]; then
            echo "Running npm test"
            npm test
          else
            echo "No JS tests detected — skipping npm test"
          fi

  self-check:
    # Dogfood the action against this repo's own fixtures.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run stellar-security-gate against test fixtures
        uses: ./
        with:
          fail-on-severity: high
          soroban-path: test/fixtures